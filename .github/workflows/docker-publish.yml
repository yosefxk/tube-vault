name: Build and Publish Docker Image to GHCR

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lower case repository name
        run: |
          echo "IMAGE_NAME=ghcr.io/${REPO_NAME,,}" >> $GITHUB_ENV
        env:
          REPO_NAME: ${{ github.repository }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Connect to Tailscale
        if: ${{ secrets.TAILSCALE_AUTHKEY != '' }}
        uses: tailscale/tailscale-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Trigger Portainer Webhook Redeploy
        if: ${{ secrets.PORTAINER_WEBHOOK_URL != '' || secrets.PORTAINER_WEBHOOK != '' }}
        run: |
          URL="${{ secrets.PORTAINER_WEBHOOK_URL }}"
          if [ -z "$URL" ]; then
            URL="${{ secrets.PORTAINER_WEBHOOK }}"
          fi
          curl -X POST "$URL" || true
